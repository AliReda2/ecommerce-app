services:
  ecommerce-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data

volumes:
  ecommerce_postgres_data:
